[tool.poetry]
name = "image-toolkit"
version = "0.1.1"
description = "Image processing tools using OpenCV"
authors = ["JianliZh429 <jianli.zh42g@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/JianliZh429/image-toolkit"
repository = "https://github.com/JianliZh429/image-toolkit"
keywords = ["image-processing", "opencv", "cli", "photo", "resize", "sketch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[tool.poetry.scripts]
image-toolkit = "cli.main:cli"

[tool.black]
line-length = 120
target-version = ['py37']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/foo.py  # exclude a file named foo.py in the root of the project (in addition to the defaults)
'''

[tool.poetry.dependencies]
python = "^3.9"
opencv-python = "^4.5.2"
opencv-contrib-python = "^4.5.2"
click = "^8.0.1"

[tool.poetry.group.dev.dependencies]
black = "^21.6b0"
flake8 = "^3.9.2"
pytest = "^7.0"
pytest-cov = "^4.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=cli --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
